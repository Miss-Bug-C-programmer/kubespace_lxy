name: stage11-candidate
on:
  push:
    branches: [main]
    paths: [.github/stage11-candidate-trigger]
permissions:
  contents: read
  statuses: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.25.12', cache: true}
      - name: Publish pending
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context="sandbox/stage11-candidate-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Validating Phase 11 candidate"
      - name: Apply deterministic Phase 11 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/stage11-apply.py
          python3 .github/stage11-apply.py
          go get google.golang.org/grpc@v1.82.1
          go get golang.org/x/text@v0.39.0
          go get go.opentelemetry.io/otel@v1.43.0 go.opentelemetry.io/otel/metric@v1.43.0 go.opentelemetry.io/otel/trace@v1.43.0 go.opentelemetry.io/otel/sdk@v1.43.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.43.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.43.0
          go mod tidy
          gofmt -w cmd/space-compute-mission-planner/*.go tests/integration/spacecomputescheduler/phase4_external_int_test.go
          chmod +x scripts/space-compute-phase11
          git diff --check
      - name: Verify production isolation and source invariants
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- pkg/executor/embed cmd/space-compute-scheduler docs/gpu-scheduler/manifests/space-compute-scheduler.yaml)"
          ! grep -R -n --include='*.go' 'ListenAndServe()' cmd/space-compute-mission-planner | grep metrics || true
          grep -R -n 'ListenAndServeTLS' cmd/space-compute-mission-planner
          grep -R -n 'TokenReviews().Create' cmd/space-compute-mission-planner
          grep -R -n 'SubjectAccessReviews().Create' cmd/space-compute-mission-planner
          grep -R -n 'MaxHeaderBytes' cmd/space-compute-mission-planner
          grep -R -n 'kind: NetworkPolicy' docs/space-compute/manifests/metrics-monitoring-access.yaml
          grep -R -n 'kind: ClusterImagePolicy' docs/space-compute/manifests/image-signature-policy.yaml
          for f in Dockerfile.space-compute-*; do
            grep -q '^FROM .*@sha256:' "$f"
            test "$(grep -c '^FROM .*@sha256:' "$f")" -eq 2
          done
      - name: Install pinned analysis tools
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          golangci-lint version
          govulncheck -version
          gitleaks version
      - name: Lint Phase 11 target surface
        shell: bash
        run: golangci-lint run --timeout=15m ./pkg/scheduler/plugins/gpustability/... ./contrib/space-compute/pkg/... ./cmd/space-compute-scheduler/... ./cmd/space-compute-mission-planner/... ./cmd/space-compute-domain-agent/...
      - name: Reachable vulnerability gate
        shell: bash
        run: govulncheck ./pkg/scheduler/plugins/gpustability ./contrib/space-compute/pkg/... ./cmd/space-compute-scheduler ./cmd/space-compute-mission-planner ./cmd/space-compute-domain-agent
      - name: Secret credential and private-key scan
        shell: bash
        run: gitleaks git --redact --no-banner --verbose .
      - name: Parse manifests and focused metrics security tests
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_stream(File.read(p)) }' docs/space-compute/manifests/*.yaml docs/gpu-scheduler/manifests/space-compute-scheduler.yaml
          go test ./cmd/space-compute-mission-planner -run 'Phase11|HealthEndpoints|Phase4AndPhase6Manifests' -count=1
          go test -race ./cmd/space-compute-mission-planner -run 'Phase11|HealthEndpoints' -count=1
      - name: Required Phase 11 grouped regressions
        shell: bash
        run: scripts/space-compute-phase11 all
      - name: Build pinned Space Compute images
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in Dockerfile.space-compute-*; do
            echo "=== $dockerfile ==="
            docker build --pull=false --progress=plain -f "$dockerfile" .
          done
      - name: Dependency and formatting invariants
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff
          test -z "$(gofmt -l cmd/space-compute-mission-planner contrib/space-compute/pkg pkg/scheduler/plugins/gpustability tests/integration/spacecomputescheduler)"
          git diff --check
          git diff --stat
      - name: Capture candidate patch
        if: always()
        shell: bash
        run: git diff --binary > /tmp/stage11-candidate.patch || true
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11-candidate-${{ github.run_id }}
          path: /tmp/stage11-candidate.patch
          if-no-files-found: error
          retention-days: 7
      - name: Publish success
        if: success()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="sandbox/stage11-candidate-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 11 candidate gates passed"
      - name: Publish failure
        if: failure()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context="sandbox/stage11-candidate-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 11 candidate failed; inspect named gate"
