name: stage10-baseline-profile
on:
  push:
    branches: [main]
    paths:
      - .github/stage10-profile-trigger
permissions:
  contents: read
  statuses: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"pending\",\"context\":\"sandbox/stage10-baseline-profile-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Profile 5000-target collector and planner baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage10-profile
          go test -c -o /tmp/stage10-profile/gpustability.test ./pkg/scheduler/plugins/gpustability
          /tmp/stage10-profile/gpustability.test -test.run '^$' -test.bench '^BenchmarkCollectorTargetDatasets/5000$' -test.benchtime=1x -test.benchmem -test.count=1 \
            -test.memprofile=/tmp/stage10-profile/collector-5000.mem -test.cpuprofile=/tmp/stage10-profile/collector-5000.cpu | tee /tmp/stage10-profile/collector-bench.txt
          go tool pprof -top -alloc_space -nodecount=40 /tmp/stage10-profile/gpustability.test /tmp/stage10-profile/collector-5000.mem > /tmp/stage10-profile/collector-alloc-top.txt
          go tool pprof -top -cum -nodecount=40 /tmp/stage10-profile/gpustability.test /tmp/stage10-profile/collector-5000.mem > /tmp/stage10-profile/collector-alloc-cum.txt
          go test -c -o /tmp/stage10-profile/planner.test ./contrib/space-compute/pkg/planner
          /tmp/stage10-profile/planner.test -test.run '^$' -test.bench '^BenchmarkMissionPlanningDatasets/5000/strict$' -test.benchtime=3x -test.benchmem -test.count=1 \
            -test.memprofile=/tmp/stage10-profile/planner-5000.mem | tee /tmp/stage10-profile/planner-bench.txt
          go tool pprof -top -alloc_space -nodecount=40 /tmp/stage10-profile/planner.test /tmp/stage10-profile/planner-5000.mem > /tmp/stage10-profile/planner-alloc-top.txt
          git rev-parse HEAD > /tmp/stage10-profile/SOURCE_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: stage10-baseline-profile
          path: /tmp/stage10-profile
          retention-days: 7
      - name: Publish success
        if: success()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"sandbox/stage10-baseline-profile-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - name: Publish failure
        if: failure()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"failure\",\"context\":\"sandbox/stage10-baseline-profile-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
