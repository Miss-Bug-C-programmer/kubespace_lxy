name: stage10-race-v6
on:
  push:
    branches: [main]
    paths: [.github/stage10-race-v6-trigger]
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed candidate and fixes and capture source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage10-v6
          cat .github/stage10-payload/payload-[0-9][0-9] > /tmp/stage10.patch.xz.b64
          echo 'ef369be65e80690ed7b116871ebb3638c3266f64bb31e2b1aa0f976e7d819f1a  /tmp/stage10.patch.xz.b64' | sha256sum -c -
          base64 -d /tmp/stage10.patch.xz.b64 | xz -dc > /tmp/stage10.patch
          echo '0e039fc2bbb25c020901ea5d1f6c079b3e117bf8c71fa1534838b52f2f66cf86  /tmp/stage10.patch' | sha256sum -c -
          git apply /tmp/stage10.patch
          for f in fix1.patch fix2.patch fix3.patch; do git apply ".github/stage10-payload/$f"; done
          cat .github/stage10-payload/fix4-chunk-* | base64 -d | xz -dc > /tmp/fix4.patch
          echo '29a0aee99e56a415bb1e81df36a2fa6cecb6b2d59f76bbe16c88db426873ba37  /tmp/fix4.patch' | sha256sum -c -
          git apply /tmp/fix4.patch
          cp pkg/scheduler/plugins/gpustability/collector.go /tmp/stage10-v6/collector.go
          cp pkg/scheduler/plugins/gpustability/collector_deadline.go /tmp/stage10-v6/collector_deadline.go
          cp pkg/scheduler/plugins/gpustability/phase10_test.go /tmp/stage10-v6/phase10_test.go
          cp pkg/scheduler/plugins/gpustability/phase1_test.go /tmp/stage10-v6/phase1_test.go
      - uses: actions/upload-artifact@v4
        with:
          name: stage10-race-v6-evidence
          path: /tmp/stage10-v6
          retention-days: 7
