name: stage10-race-v6
on:
  push:
    branches: [main]
    paths: [.github/stage10-race-v6-trigger]
permissions:
  contents: write
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"pending\",\"context\":\"sandbox/stage10-race-v6-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.12', cache: true}
      - name: Apply reviewed candidate and fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage10-v6
          cat .github/stage10-payload/payload-[0-9][0-9] > /tmp/stage10.patch.xz.b64
          echo 'ef369be65e80690ed7b116871ebb3638c3266f64bb31e2b1aa0f976e7d819f1a  /tmp/stage10.patch.xz.b64' | sha256sum -c -
          base64 -d /tmp/stage10.patch.xz.b64 | xz -dc > /tmp/stage10.patch
          echo '0e039fc2bbb25c020901ea5d1f6c079b3e117bf8c71fa1534838b52f2f66cf86  /tmp/stage10.patch' | sha256sum -c -
          git apply --check --whitespace=error-all /tmp/stage10.patch
          git apply /tmp/stage10.patch
          for spec in \
            'fix1.patch:6af9cd116950034598fbeac91dd4432b9f79f6298c21f1ee0149b7db1a69ed9a' \
            'fix2.patch:b16ef3bde45ca1d3ed3cf3ad383ae3aff396af749843fa18c9c28d394e9ebf43' \
            'fix3.patch:4680e26bbcb7b221408aebda5a1a28b19b580e391a8f77afd092d1e23807b171'; do
            f=${spec%%:*}; h=${spec#*:}; echo "$h  .github/stage10-payload/$f" | sha256sum -c -; git apply --check --whitespace=error-all ".github/stage10-payload/$f"; git apply ".github/stage10-payload/$f";
          done
          echo 'b7bdeb719308541e814bdc23cca8ea3d965bed161e3b5caad3548b4f491f6c5e  .github/stage10-payload/fix4-chunk-00' | sha256sum -c -
          echo '0bf1782d11d053b8b9d3a1eb9469767857bd16db74bf91fe086079b8378cd313  .github/stage10-payload/fix4-chunk-01' | sha256sum -c -
          echo '6a784543d16593e5157b0e13895acb6cd14a9acef68de2cb69472355703f40cc  .github/stage10-payload/fix4-chunk-02' | sha256sum -c -
          cat .github/stage10-payload/fix4-chunk-* > /tmp/fix4.patch.xz.b64
          echo '7a2df490d54c8922852beb7aaaab4ac765a52e47ac4b6edb1cbdce7ba8166dcb  /tmp/fix4.patch.xz.b64' | sha256sum -c -
          base64 -d /tmp/fix4.patch.xz.b64 > /tmp/fix4.patch.xz
          echo 'e15ca28bb3d73fa04eba79a3837a3b7c39d59e4fe500a2c874179ec68b96259e  /tmp/fix4.patch.xz' | sha256sum -c -
          xz -dc /tmp/fix4.patch.xz > /tmp/fix4.patch
          echo '29a0aee99e56a415bb1e81df36a2fa6cecb6b2d59f76bbe16c88db426873ba37  /tmp/fix4.patch' | sha256sum -c -
          git apply --check --whitespace=error-all /tmp/fix4.patch
          git apply /tmp/fix4.patch
          git diff --check
          git add -A
          git diff --cached --check
      - name: Source invariants and scheduler isolation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd/space-compute-mission-planner contrib/space-compute/pkg/kube contrib/space-compute/pkg/planner pkg/scheduler/plugins/gpustability)"
          ! grep -n 'strings.NewReader(string(raw))' pkg/scheduler/plugins/gpustability/collector.go
          ! grep -R -n 'scheduleDue' pkg/scheduler/plugins/gpustability
          grep -n 'bytes.NewReader(raw)' pkg/scheduler/plugins/gpustability/collector.go
          grep -n 'deadline-driven' pkg/scheduler/plugins/gpustability/collector.go
          grep -n 'PlanningIndex' cmd/space-compute-mission-planner/main.go contrib/space-compute/pkg/kube/repository.go
          grep -n 'materialCanonicalDigest' contrib/space-compute/pkg/planner/prepared_inputs.go
          test -z "$(git diff --name-only HEAD -- pkg/executor/embed cmd/space-compute-scheduler docs/gpu-scheduler/manifests/space-compute-scheduler.yaml)"
          test -z "$(git diff --name-only HEAD -- .github)"
      - name: Focused and race
        shell: bash
        run: |
          set -euo pipefail
          go test ./pkg/scheduler/plugins/gpustability -run 'Phase10|CollectorBackoffAndCircuitState|CollectorScaleBoundsAndLifecycle|CycleSnapshotExpiryAppliesNextCycleOnly|ConcurrentTargetReloadAndSnapshotAccess|UnifiedSnapshotCarriesNodeResourceContext' -count=1 | tee /tmp/stage10-v6/focused-gpu.log
          go test ./contrib/space-compute/pkg/planner ./contrib/space-compute/pkg/kube ./cmd/space-compute-mission-planner -run 'Phase10|ControllerRestartDuplicateIntentAndCrossDomainFence|StabilityOnlyChangeChangesDigestMaterialInputAndTriggersReplan' -count=1 | tee /tmp/stage10-v6/focused-controller.log
          go test -race ./pkg/scheduler/plugins/gpustability ./contrib/space-compute/pkg/planner ./contrib/space-compute/pkg/kube ./cmd/space-compute-mission-planner -count=1 | tee /tmp/stage10-v6/race.log
      - name: Complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          scripts/space-compute all | tee /tmp/stage10-v6/space-compute-all.log
          go test ./pkg/executor/embed -count=1 | tee /tmp/stage10-v6/embed.log
          go mod verify | tee /tmp/stage10-v6/mod-verify.log
          go mod tidy -diff | tee /tmp/stage10-v6/mod-tidy.log
      - name: Post-change pprof and 5000-scale benchmarks
        shell: bash
        run: |
          set -euo pipefail
          go test -c -o /tmp/stage10-v6/gpustability.test ./pkg/scheduler/plugins/gpustability
          /tmp/stage10-v6/gpustability.test -test.run '^$' -test.bench '^BenchmarkCollectorTargetDatasets/5000$' -test.benchtime=1x -test.benchmem -test.count=1 -test.memprofile=/tmp/stage10-v6/collector.mem -test.cpuprofile=/tmp/stage10-v6/collector.cpu | tee /tmp/stage10-v6/collector-bench.txt
          go tool pprof -top -alloc_space -nodecount=40 /tmp/stage10-v6/gpustability.test /tmp/stage10-v6/collector.mem | tee /tmp/stage10-v6/collector-alloc-top.txt
          go test -c -o /tmp/stage10-v6/planner.test ./contrib/space-compute/pkg/planner
          /tmp/stage10-v6/planner.test -test.run '^$' -test.bench '^BenchmarkPreparedMissionPlanningDatasets/5000$' -test.benchtime=3x -test.benchmem -test.count=1 -test.memprofile=/tmp/stage10-v6/planner.mem | tee /tmp/stage10-v6/planner-bench.txt
          go tool pprof -top -alloc_space -nodecount=40 /tmp/stage10-v6/planner.test /tmp/stage10-v6/planner.mem | tee /tmp/stage10-v6/planner-alloc-top.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage10-race-v6-evidence
          path: /tmp/stage10-v6
          retention-days: 7
      - name: Publish verified production patch
        shell: bash
        run: |
          set -euo pipefail
          git diff HEAD --check
          test -z "$(git diff --name-only HEAD -- .github)"
          test -z "$(git diff --name-only HEAD -- pkg/executor/embed cmd/space-compute-scheduler docs/gpu-scheduler/manifests/space-compute-scheduler.yaml)"
          if git diff --cached --quiet; then
            echo 'verified Phase 10 patch is unexpectedly empty' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(space-compute): optimize collector and planner runtime'
          git push origin HEAD:main
      - name: Publish success
        if: success()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"success\",\"context\":\"sandbox/stage10-race-v6-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - name: Publish failure
        if: failure()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"failure\",\"context\":\"sandbox/stage10-race-v6-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
