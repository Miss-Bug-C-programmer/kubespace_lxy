name: stage10-final-cleanup
on:
  push:
    branches: [main]
    paths: [.github/stage10-race-v6-trigger]
permissions:
  contents: write
  statuses: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"pending\",\"context\":\"sandbox/stage10-cleanup-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify production source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 19609892ada3e46ba0ec93f1b0d128e330263e2c HEAD -- \
            cmd/space-compute-mission-planner \
            contrib/space-compute/pkg/kube \
            contrib/space-compute/pkg/planner \
            pkg/scheduler/plugins/gpustability \
            pkg/executor/embed \
            cmd/space-compute-scheduler \
            docs/gpu-scheduler/manifests/space-compute-scheduler.yaml
          grep -F '191.332 MB / 474.468 ms' docs/space-compute/PHASE5_RISK_REGISTER.md
          grep -F 'Actions run `30335789459`' docs/space-compute/IMPLEMENTATION_STATUS.md
          grep -F '474.468 ms; 191.332 MB; 3,311,584 allocs' docs/space-compute/PHASE5_PERFORMANCE.md
      - name: Remove Phase 10 staging artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/stage10-payload
          rm -f .github/stage10-*-trigger
          rm -f .github/workflows/stage10-*.yml
          git diff --check
          if find .github -maxdepth 2 -type f \( -name 'stage10-*' -o -path '.github/stage10-payload/*' \) -print -quit | grep -q .; then
            echo 'Phase 10 staging artifacts remain' >&2
            find .github -maxdepth 2 -type f \( -name 'stage10-*' -o -path '.github/stage10-payload/*' \) -print >&2
            exit 1
          fi
      - name: Publish cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git add -A .github
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -Ev '^\.github/(stage10-|workflows/stage10-)' ; then
            echo 'cleanup attempted to modify non-Phase10 files' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove phase10 staging artifacts'
          git push origin HEAD:main
          final=$(git rev-parse HEAD)
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$final" -d "{\"state\":\"success\",\"context\":\"sandbox/stage10-cleanup-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - name: Publish trigger success
        if: success()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"success\",\"context\":\"sandbox/stage10-cleanup-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - name: Publish failure
        if: failure()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"failure\",\"context\":\"sandbox/stage10-cleanup-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
