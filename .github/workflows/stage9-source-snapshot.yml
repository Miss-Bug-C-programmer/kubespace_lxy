name: stage9-source-snapshot
on:
  push:
    branches: [main]
    paths: [.github/stage9-source-trigger]
permissions:
  contents: read
  statuses: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
    - name: Publish snapshot pending
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context="sandbox/stage9-source-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Exporting Phase 9 source snapshot"
    - uses: actions/checkout@v4
      with: {ref: "${{ github.sha }}", fetch-depth: 0}
    - name: Build source snapshot
      run: |
        set -euo pipefail
        tar --exclude=.git -czf "$RUNNER_TEMP/stage9-source.tar.gz" \
          AGENTS.md go.mod go.sum scripts \
          cmd/space-compute-mission-planner cmd/space-compute-mission-webhook cmd/space-compute-reporter-webhook cmd/space-compute-domain-agent \
          contrib/space-compute docs/space-compute docs/gpu-scheduler \
          pkg/scheduler/plugins/gpustability pkg/executor/embed tests/integration/spacecomputescheduler
    - uses: actions/upload-artifact@v4
      with:
        name: stage9-source
        path: ${{ runner.temp }}/stage9-source.tar.gz
        retention-days: 30
    - name: Publish snapshot success
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="sandbox/stage9-source-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 9 source snapshot exported"
