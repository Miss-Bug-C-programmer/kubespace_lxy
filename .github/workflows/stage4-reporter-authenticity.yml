name: stage4-reporter-authenticity-main
on:
  push:
    branches: [main]
    paths:
    - .github/workflows/stage4-reporter-authenticity.yml
permissions:
  contents: write
concurrency:
  group: stage4-reporter-authenticity-main
  cancel-in-progress: false
jobs:
  fix-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Complete and apply recovered production fix
      shell: bash
      run: |
        set -o pipefail
        : > /tmp/stage4-gates.log
        {
          set -euo pipefail
          python3 - <<'PY'
        from pathlib import Path
        source = Path('.github/stage4-recovered.py').read_text()
        marker = 'append_once("docs/space-compute/PHASE4_API_AND_OPERATIONS.md", "Trusted reporter-domain admission"'
        head = source.split(marker, 1)[0]
        tail = r'''
        append_once("docs/space-compute/PHASE4_API_AND_OPERATIONS.md", "Trusted reporter-domain admission", '''## Trusted reporter-domain admission

Reporter-owned cross-domain objects are admitted through the fail-closed `space-compute-reporter-webhook`. Administrators create one cluster-scoped `SpaceDomainReporterBinding` whose deterministic name is derived from the authenticated principal. The binding fixes the reporter domain, allowed kinds, explicit peers and one Ed25519 public-key reference.

Reporter object names are derived from normalized domain or directed-link identity. Canonical provenance uses `spacecompute-canonical-v1`, fixed field order, UTC RFC3339Nano timestamps, explicitly sorted map/set-like values, and excludes only digest and signature. Reporters submit lowercase SHA-256 plus a base64 Ed25519 signature. CREATE requires sequence 1 and empty previous digest; UPDATE requires exact sequence increment, exact previous digest, increasing timestamp and immutable reporter/domain/source/destination/stable identity.

Provision the webhook TLS Secret and CA bundle before granting reporter writes. Reporter roles receive CREATE plus exact `resourceNames` for GET/UPDATE/PATCH; no shared reporter role receives unrestricted mutation of all cluster-scoped summaries or snapshots.''')

        for path, content in NEW_FILES.items():
            write(path, content)
        '''
        Path('/tmp/stage4-fixed.py').write_text(head + tail)
        PY
          python3 -m py_compile /tmp/stage4-fixed.py
          python3 /tmp/stage4-fixed.py
          gofmt -w contrib/space-compute/pkg/apis/v1alpha1/*.go contrib/space-compute/pkg/admission/*.go contrib/space-compute/pkg/planner/*.go cmd/space-compute-mission-planner/*.go cmd/space-compute-reporter-webhook/*.go
          git diff --check
        } 2>&1 | tee -a /tmp/stage4-gates.log
    - name: Focused reporter truth regressions
      shell: bash
      run: |
        set -o pipefail
        {
          set -euo pipefail
          go test ./contrib/space-compute/pkg/apis/v1alpha1 -run '^(TestCanonicalReporterDigestIsStableAndCoversSchedulingFields|TestCanonicalResourceSummarySortsMapAndSetLikeFields|TestDerivedReporterObjectNamesBindFullDomainIdentity|TestReporterBindingValidationUsesPrincipalDerivedNameAndImmutableDomain|TestLinkValidationRejectsOverlapSkewStaleAndFastUnchangedUpdate)$' -count=1 -timeout=90s
          go test ./contrib/space-compute/pkg/admission -run '^(TestValidatorAcceptsTrustedSignedLinkAndRejectsForgery|TestValidatorEnforcesExactDigestChainIdentityAndStabilityUpdate|TestValidatorCoversSummaryAndReceiptKinds|TestAdmissionHTTPHandlerFailsClosed|TestKubernetesTrustSourceUsesDerivedBindingAndSingleSecret)$' -count=1 -timeout=90s
          go test ./contrib/space-compute/pkg/planner -run '^TestStabilityOnlyChangeChangesDigestMaterialInputAndTriggersReplan$' -count=1 -timeout=90s
          go test ./cmd/space-compute-mission-planner -run '^TestPhase4ManifestsHaveCRDsAdmissionIsolationAndLeastPrivilege$' -count=1 -timeout=90s
          go test ./cmd/space-compute-reporter-webhook -count=1 -timeout=90s
          go build -buildvcs=false ./cmd/space-compute-reporter-webhook
        } 2>&1 | tee -a /tmp/stage4-gates.log
    - name: Focused race regressions
      shell: bash
      run: |
        set -o pipefail
        { set -euo pipefail; go test -race ./contrib/space-compute/pkg/apis/v1alpha1 ./contrib/space-compute/pkg/admission ./contrib/space-compute/pkg/planner -run 'Test(Canonical|ReporterBinding|Validator|AdmissionHTTP|KubernetesTrustSource|StabilityOnly)' -count=1 -timeout=180s; } 2>&1 | tee -a /tmp/stage4-gates.log
    - name: Full CPU qualification and default-K3s boundary
      shell: bash
      run: |
        set -o pipefail
        { set -euo pipefail; env GOCACHE="$RUNNER_TEMP/space-compute-stage4-gocache" scripts/space-compute all; go test ./pkg/executor/embed -count=1 -timeout=120s; } 2>&1 | tee -a /tmp/stage4-gates.log
    - name: Audit trust, RBAC and scheduler boundaries
      shell: bash
      run: |
        set -o pipefail
        {
          set -euo pipefail
          test -z "$(gofmt -s -l contrib/space-compute/pkg/apis/v1alpha1/*.go contrib/space-compute/pkg/admission/*.go contrib/space-compute/pkg/planner/*.go cmd/space-compute-reporter-webhook/*.go)"
          go vet ./contrib/space-compute/pkg/apis/v1alpha1 ./contrib/space-compute/pkg/admission ./contrib/space-compute/pkg/planner ./cmd/space-compute-reporter-webhook
          grep -q 'StabilityMilli, w.ConfidenceMilli, w.Predicted' contrib/space-compute/pkg/apis/v1alpha1/validation.go
          grep -q 'ed25519.Verify' contrib/space-compute/pkg/admission/validator.go
          grep -q 'resourceNames: \[space-compute-reporter-public-keys\]' docs/space-compute/manifests/reporter-admission-webhook.yaml
          ! grep -q 'verbs: \[create, get, update, patch\]' docs/space-compute/manifests/mission-planner.yaml
          ! grep -R 'contrib/space-compute/pkg/admission' pkg/executor pkg/scheduler cmd/k3s 2>/dev/null
          git diff --check
        } 2>&1 | tee -a /tmp/stage4-gates.log
    - name: Record validation evidence
      shell: bash
      run: |
        set -euo pipefail
        for file in docs/space-compute/IMPLEMENTATION_STATUS.md docs/space-compute/PHASE5_TEST_REPORT.md; do sed -i "s/__RUN_ID__/${GITHUB_RUN_ID}/g; s/__BASE_SHA__/${GITHUB_SHA}/g" "$file"; done
        git diff --check
    - name: Commit tested fix directly to main
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin main
        test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
        rm -rf .github/stage4-payload
        rm -f .github/stage4-apply.py.gz.b64 .github/stage4-apply.py.gz.b64.part* .github/stage4-recovered.py .github/workflows/stage4-reporter-authenticity.yml .github/stage4-failure.txt
        git add -A
        git diff --cached --check
        git config user.name "space-compute-stage4-bot"
        git config user.email "space-compute-stage4-bot@users.noreply.github.com"
        git commit -m "fix: enforce reporter-domain data authenticity"
        git push origin HEAD:main
    - name: Publish failure diagnostics on main
      if: failure()
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin main
        [ "$(git rev-parse origin/main)" = "${GITHUB_SHA}" ] || exit 0
        { echo "trigger_sha=${GITHUB_SHA}"; echo "run_id=${GITHUB_RUN_ID}"; echo '--- last gate output ---'; tail -n 500 /tmp/stage4-gates.log 2>/dev/null || true; } > .github/stage4-failure.txt
        git add .github/stage4-failure.txt
        git config user.name "space-compute-stage4-bot"
        git config user.email "space-compute-stage4-bot@users.noreply.github.com"
        git commit -m "chore: capture stage4 validation failure"
        git push origin HEAD:main