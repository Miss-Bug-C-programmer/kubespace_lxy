name: stage10-source-snapshot
on:
  push:
    branches: [main]
    paths:
      - .github/stage10-source-trigger
permissions:
  contents: read
  statuses: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Publish snapshot pending
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"pending\",\"context\":\"sandbox/stage10-source-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - uses: actions/checkout@v4
      - name: Capture exact Phase 10 source surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage10-source
          paths=(
            AGENTS.md
            go.mod go.sum Makefile scripts/space-compute
            pkg/scheduler/plugins/gpustability
            pkg/executor/embed/embed.go
            cmd/space-compute-scheduler
            cmd/space-compute-mission-planner
            contrib/space-compute/pkg/planner
            contrib/space-compute/pkg/kube
            contrib/space-compute/pkg/apis/v1alpha1
            contrib/space-compute/pkg/apis/v1beta1
            tests/integration/spacecomputescheduler
            docs/space-compute/IMPLEMENTATION_STATUS.md
            docs/space-compute/PHASE5_PERFORMANCE.md
            docs/space-compute/PHASE5_RISK_REGISTER.md
            docs/gpu-scheduler/README.md
            docs/gpu-scheduler/manifests/space-compute-scheduler.yaml
          )
          for p in "${paths[@]}"; do
            if [ -e "$p" ]; then
              mkdir -p "/tmp/stage10-source/$(dirname "$p")"
              cp -a "$p" "/tmp/stage10-source/$p"
            fi
          done
          git rev-parse HEAD > /tmp/stage10-source/SOURCE_SHA
          git status --short > /tmp/stage10-source/SOURCE_STATUS
          grep -RInE 'strings\.NewReader\(string\(raw\)\)|scheduleDue|refreshNode|PlanningSnapshot|materialInputDigest|MaterialInputDigest|Benchmark.*5000|5000' \
            pkg/scheduler/plugins/gpustability contrib/space-compute/pkg/planner contrib/space-compute/pkg/kube cmd/space-compute-mission-planner tests/integration/spacecomputescheduler \
            > /tmp/stage10-source/HOTSPOTS.txt || true
          tar -C /tmp -czf /tmp/stage10-source.tgz stage10-source
      - uses: actions/upload-artifact@v4
        with:
          name: stage10-source
          path: /tmp/stage10-source.tgz
          retention-days: 7
      - name: Publish snapshot success
        if: success()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"sandbox/stage10-source-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - name: Publish snapshot failure
        if: failure()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"failure\",\"context\":\"sandbox/stage10-source-${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
