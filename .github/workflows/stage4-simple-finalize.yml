name: stage4-simple-finalize
on:
  push:
    branches: [main]
    paths:
      - .github/stage4-trigger-v2
permissions:
  contents: write
  statuses: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="sandbox/stage4-reporter-${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Stage 4 reporter authenticity validation is running"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply, validate and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage4-hardening.py
          gofmt -w \
            pkg/scheduler/plugins/gpustability/metrics_profiles.go \
            pkg/scheduler/plugins/gpustability/phase1_test.go
          python3 - <<'PY'
          from pathlib import Path

          recovered_path = Path('.github/stage4-recovered.py')
          recovered = recovered_path.read_text()
          bad_build_separator = r'\\n\\tgo build -buildvcs=false'
          good_build_separator = r'\n\tgo build -buildvcs=false'
          if recovered.count(bad_build_separator) != 1:
              raise SystemExit('stage4 recovered build separator marker mismatch')
          recovered_path.write_text(recovered.replace(bad_build_separator, good_build_separator, 1))

          path = Path('.github/stage4-finalize.sh')
          text = path.read_text()
          old = '    .github/stage4-failure.txt \\\n'
          new = '    .github/stage4-failure.txt \\\n    .github/stage4-hardening.py \\\n'
          if old not in text:
              raise SystemExit('stage4 cleanup marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          bash .github/stage4-finalize.sh
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="sandbox/stage4-reporter-${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Stage 4 reporter authenticity validation passed"
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="sandbox/stage4-reporter-${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Stage 4 reporter authenticity validation failed"
