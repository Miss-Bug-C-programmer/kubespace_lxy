name: stage8-source-snapshot
on:
  push:
    branches: [main]
    paths: [.github/stage8-source-trigger]
permissions:
  contents: read
  statuses: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
    - name: Publish snapshot status
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context="sandbox/stage8-source-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Exporting Phase 8 controller source snapshot"
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
    - name: Build source snapshot
      run: |
        set -euo pipefail
        tar -czf /tmp/stage8-source.tgz \
          go.mod go.sum scripts/space-compute \
          cmd/space-compute-mission-planner \
          contrib/space-compute/pkg \
          tests/integration/spacecomputescheduler \
          docs/space-compute/IMPLEMENTATION_STATUS.md \
          docs/space-compute/PHASE4_API_AND_OPERATIONS.md \
          docs/space-compute/PHASE5_*.md \
          docs/space-compute/manifests \
          docs/gpu-scheduler/manifests/space-compute-scheduler.yaml
    - uses: actions/upload-artifact@v4
      with:
        name: stage8-controller-source
        path: /tmp/stage8-source.tgz
        if-no-files-found: error
    - name: Publish snapshot success
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="sandbox/stage8-source-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 8 controller source snapshot exported"
