name: stage7-planner-correctness-v2
on:
  push:
    branches: [main]
    paths: [.github/stage7-finalize-v2-trigger]
permissions:
  contents: write
  statuses: write
concurrency:
  group: stage7-planner-correctness-main
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Publish pending status
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context="sandbox/stage7-planner-correctness-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Revalidating Phase 7 planner correctness hardening"
    - uses: actions/checkout@v4
      with: {ref: "${{ github.sha }}", fetch-depth: 0}
    - uses: actions/setup-go@v5
      with: {go-version-file: go.mod, cache: true}
    - name: Apply verified Phase 7 production patch
      run: |
        set -euo pipefail
        cat \
          .github/stage7-payload/part-00 \
          .github/stage7-payload/fix-01-00-00 .github/stage7-payload/fix-01-00-01 .github/stage7-payload/fix-01-00-02 .github/stage7-payload/fix-01-00-03 \
          .github/stage7-payload/fix-01-01 .github/stage7-payload/fix-01-02 \
          .github/stage7-payload/part-02 .github/stage7-payload/part-03 .github/stage7-payload/part-04 \
          .github/stage7-payload/fix-05-00 .github/stage7-payload/fix-05-01 .github/stage7-payload/fix-05-02 \
          .github/stage7-payload/part-06 > /tmp/stage7-source.b64
        python3 - <<'PY'
        import base64, hashlib, zlib
        from pathlib import Path
        payload = Path('/tmp/stage7-source.b64').read_bytes()
        raw = zlib.decompress(base64.b64decode(payload, validate=True))
        digest = hashlib.sha256(raw).hexdigest()
        expected = 'f75f3dc8a052ab1db83f5016aeb37bb81b2215670f13f123b3881832dc8b007a'
        if digest != expected:
            raise SystemExit(f'Phase 7 patch SHA-256 mismatch: {digest} != {expected}')
        Path('/tmp/stage7.patch').write_bytes(raw)
        PY
        git apply --check /tmp/stage7.patch
        git apply /tmp/stage7.patch
        python3 .github/stage7-fixture-fix.py
    - name: Format Phase 7 Go source
      run: |
        set -euo pipefail
        gofmt -w \
          cmd/space-compute-mission-planner/*.go \
          contrib/space-compute/pkg/apis/v1alpha1/*.go \
          contrib/space-compute/pkg/planner/*.go \
          contrib/space-compute/pkg/execution/*.go \
          contrib/space-compute/pkg/policy/*.go \
          contrib/space-compute/pkg/workload/*.go \
          pkg/scheduler/plugins/gpustability/phase4_test.go \
          tests/integration/spacecomputescheduler/*.go
    - name: Diff and YAML checks
      run: |
        set -euo pipefail
        git diff --check
        ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_stream(File.read(p)) }' docs/space-compute/manifests/*.yaml docs/gpu-scheduler/manifests/space-compute-scheduler.yaml
    - name: Verify Phase 7 invariants and default scheduler isolation
      run: |
        set -euo pipefail
        changed="$(git diff --name-only "$GITHUB_SHA" -- pkg/scheduler/plugins/gpustability cmd/space-compute-scheduler docs/gpu-scheduler/manifests/space-compute-scheduler.yaml | grep -v '^pkg/scheduler/plugins/gpustability/.*_test.go$' || true)"
        test -z "$changed"
        grep -q 'type DataLocation struct' contrib/space-compute/pkg/apis/v1alpha1/types.go
        grep -q 'Locations \[\]DataLocation' contrib/space-compute/pkg/apis/v1alpha1/types.go
        grep -q 'ResultDestinations.*\[\]DataLocation' contrib/space-compute/pkg/apis/v1alpha1/types.go
        grep -q 'func maxFlow' contrib/space-compute/pkg/planner/allocation.go
        grep -q 'selectedCapabilities \[\]spacev1.CapabilityRequirement' contrib/space-compute/pkg/planner/planner.go
        grep -q 'selectedSetName.*string' contrib/space-compute/pkg/planner/planner.go
        grep -q 'directedDomainKey' contrib/space-compute/pkg/planner/planner.go
        grep -q 'checkedMulInt64(size, 8)' contrib/space-compute/pkg/planner/planner.go
        grep -q 'MaxPlannerTopologyEntries' contrib/space-compute/pkg/apis/v1alpha1/bounds.go
        grep -q 'DataLocation' pkg/scheduler/plugins/gpustability/phase4_test.go
        ! grep -q 'links\[source+"->"+target.Name\]' contrib/space-compute/pkg/planner/planner.go
        ! grep -q 'links\[source.Name+"->"+destination\]' contrib/space-compute/pkg/planner/planner.go
    - name: Run focused Phase 7 tests
      run: |
        set -o pipefail
        go test ./contrib/space-compute/pkg/apis/v1alpha1 ./contrib/space-compute/pkg/planner ./contrib/space-compute/pkg/workload ./contrib/space-compute/pkg/policy ./contrib/space-compute/pkg/execution ./cmd/space-compute-mission-planner ./pkg/scheduler/plugins/gpustability -count=1 2>&1 | tee /tmp/stage7-focused.log
        go test -race ./contrib/space-compute/pkg/apis/v1alpha1 ./contrib/space-compute/pkg/planner -count=1 2>&1 | tee /tmp/stage7-race.log
    - name: Run complete repository gate
      run: |
        set -o pipefail
        scripts/space-compute all 2>&1 | tee /tmp/space-compute-all.log
    - name: Record Phase 7 verification evidence
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        from pathlib import Path
        p = Path('docs/space-compute/IMPLEMENTATION_STATUS.md')
        text = p.read_text()
        marker = '## Phase 7 planner correctness hardening\n'
        if marker in text:
            raise SystemExit('Phase 7 status section already exists')
        section = f'''\n## Phase 7 planner correctness hardening\n\n- Executed on 2026-07-26 by GitHub Actions run `{os.environ["GITHUB_RUN_ID"]}` from validation baseline `{os.environ["GITHUB_SHA"]}`.\n- Capability matching normalizes and aggregates equivalent constraints, then allocates `RequiredCapabilities` plus one deterministic alternative set through a bounded max-flow. A physical capacity bucket is consumed once and selected set/allocation details are emitted in placement explanations.\n- Compute estimation uses the selected required+alternative allocation, including alternative-only missions.\n- Planner fixed-width arithmetic is checked for transfer bits/durations, queue and safety delays, compute scaling, byte totals, score weighting and timestamp addition; v1alpha1 validation/CRDs bound capacity, compute, queue, snapshot-age, software, topology and transfer counts.\n- Mission input/result locations are structured `DataLocation` values containing a full `DomainReference` plus optional URI. Directed-link indexing uses complete clusterID/name/orbitClass identities; same-named domains in different clusters are not interchangeable.\n- Exact successful gates: focused package tests including the Phase 4 scheduler integration fixture; planner/API race tests; `scripts/space-compute all`; YAML parse and explicit default-scheduler/Phase-7 invariants.\n- Default K3s scheduler production source/profile/manifest remained outside this diff; only its Phase 4 test fixture was migrated to the structured identity API. Existing legacy v1alpha1 Missions with string locations require explicit migration to structured `DataLocation` objects.\n\n'''
        insert = text.find('## Verified plugin catalogue')
        if insert < 0:
            raise SystemExit('status insertion marker missing')
        p.write_text(text[:insert] + section + text[insert:])
        PY
    - name: Upload gate failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: stage7-planner-correctness-v2-error
        path: |
          /tmp/stage7-focused.log
          /tmp/stage7-race.log
          /tmp/space-compute-all.log
        if-no-files-found: ignore
    - name: Fast-forward Phase 7 production source
      id: publish
      run: |
        set -euo pipefail
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
        git rm -f \
          .github/stage7-inspect-trigger \
          .github/stage7-finalize-trigger \
          .github/stage7-finalize-v2-trigger \
          .github/stage7-fixture-fix.py \
          .github/workflows/stage7-inspect.yml \
          .github/workflows/stage7-planner-correctness.yml \
          .github/workflows/stage7-planner-correctness-v2.yml \
          .github/stage7-payload/*
        git add \
          cmd/space-compute-mission-planner/main_test.go \
          contrib/space-compute/pkg/apis/v1alpha1 \
          contrib/space-compute/pkg/execution/fence_test.go \
          contrib/space-compute/pkg/planner \
          contrib/space-compute/pkg/policy/local_test.go \
          contrib/space-compute/pkg/workload/controller_test.go \
          contrib/space-compute/pkg/workload/transport_split_test.go \
          contrib/space-compute/testdata/golden \
          docs/space-compute/IMPLEMENTATION_STATUS.md \
          docs/space-compute/PHASE7_PLANNER_CORRECTNESS.md \
          docs/space-compute/manifests/phase4-admission.yaml \
          docs/space-compute/manifests/phase4-crds.yaml \
          docs/space-compute/manifests/phase5-transport-execution-crds.yaml \
          pkg/scheduler/plugins/gpustability/phase4_test.go \
          tests/integration/spacecomputescheduler/phase4_external_int_test.go
        git diff --cached --check
        git config user.name space-compute-stage7-bot
        git config user.email space-compute-stage7-bot@users.noreply.github.com
        git commit -m 'fix: harden space-compute planner correctness'
        new_sha="$(git rev-parse HEAD)"
        git push origin HEAD:main
        echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
    - name: Publish final success status
      if: success()
      env:
        GH_TOKEN: "${{ github.token }}"
        NEW_SHA: "${{ steps.publish.outputs.new_sha }}"
      run: |
        gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="sandbox/stage7-planner-correctness-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 7 gate passed and main fast-forwarded"
        gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA}" -f state=success -f context="sandbox/stage7-planner-correctness" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Planner correctness hardening verified"
    - name: Publish failure status
      if: failure()
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context="sandbox/stage7-planner-correctness-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 7 failed before production fast-forward"
