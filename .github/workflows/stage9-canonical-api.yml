name: stage9-canonical-api
on:
  push:
    branches: [main]
    paths: [.github/stage9-gate-trigger]
permissions: {contents: write, statuses: write}
concurrency: {group: stage9-canonical-api-main, cancel-in-progress: false}
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
    - name: Publish pending status
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context="sandbox/stage9-canonical-api-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Validating Phase 9 canonical API upgrade"
    - uses: actions/checkout@v4
      with: {ref: "${{ github.sha }}", fetch-depth: 0}
    - uses: actions/setup-go@v5
      with: {go-version-file: go.mod, cache: true}
    - name: Verify and apply reviewed Phase 9 patch
      run: |
        set -euo pipefail
        printf '%s  %s\n' \
          fb1d7bebfae8b222b7001953668759f269ec5fb4f6a8e859c34a72922beb6e00 .github/stage9-payload/payload-00 \
          5e9551cc01e225aa7c827a1c39c075545420bbe79b8ae5c66453c77d24aacbd2 .github/stage9-payload/payload-01 \
          e0d37dd7161d68b435f8e0d5bebcedb17f05366bab4dc9476c4d510d0c75e54f .github/stage9-payload/payload-02 \
          5c060542eaab185b0dc8e8db59fa772dc23bf5a8a6ed184d587cdb1856c90f69 .github/stage9-payload/payload-03 \
          8de5ddde578d257ffb87ba553ca476bef0dcbea844d8f04f9ec54f308454fb7d .github/stage9-payload/payload-04 \
          c1ab0b877d2928d7e9905a3224ade91b269b52ac04239b8c6c9b21dbf7ad5d93 .github/stage9-payload/payload-05 \
          fef097658cda150729d66be8e6db1f0e48452fe01743502810417195d19f97d8 .github/stage9-payload/payload-06 \
          8b27a2bea5b5c224d3fe45ff27e893bc3e334d0603c4373418ee95850f61a09f .github/stage9-payload/payload-07 | sha256sum -c -
        cat .github/stage9-payload/payload-* > /tmp/stage9.patch.xz.b64
        echo '30e976f7e0ac3f62fdc215804915aab7e12e5ee27912d132496cf8c6872918f9  /tmp/stage9.patch.xz.b64' | sha256sum -c -
        base64 -d /tmp/stage9.patch.xz.b64 > /tmp/stage9.patch.xz
        echo 'f032e49e0e2a7d7870ff3aca1c9ae64bd641322f9fcc900324b18a42b4aeac2f  /tmp/stage9.patch.xz' | sha256sum -c -
        xz -dc /tmp/stage9.patch.xz > /tmp/stage9.patch
        echo 'ffa652ac4ceaa623d7c0288be452bd8962090d0d54e99b43f058f8c92e639204  /tmp/stage9.patch' | sha256sum -c -
        git apply --check --whitespace=error-all /tmp/stage9.patch
        git apply /tmp/stage9.patch
        echo '3fdf48845339f5c802563b018852bfe6a6653677cddd6aa1265137b6f641768c  .github/stage9-payload/fix.patch' | sha256sum -c -
        git apply --check --whitespace=error-all .github/stage9-payload/fix.patch
        git apply .github/stage9-payload/fix.patch
    - name: Verify Phase 9 schemas and isolation
      run: |
        set -euo pipefail
        git diff --check
        ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_stream(File.read(p)) }' docs/space-compute/manifests/*.yaml docs/gpu-scheduler/manifests/space-compute-scheduler.yaml
        ruby -ryaml -e 'd=YAML.load_stream(File.read(ARGV[0])); c=d.select{|x|x&&x["kind"]=="CustomResourceDefinition"}; abort("CRD count") unless c.size==11; c.each{|x|v=x.dig("spec","versions").to_h{|z|[z["name"],z]};a=v["v1alpha1"];b=v["v1beta1"];abort("version contract") unless a&&b&&a["served"]&&a["storage"]==false&&b["served"]&&b["storage"]&&a["schema"]==b["schema"]&&x.dig("spec","conversion","strategy")=="Webhook"&&x.dig("spec","conversion","webhook","clientConfig","service","path")=="/convert"}' docs/space-compute/manifests/phase9-canonical-crds.yaml
        changed="$(git diff --name-only "$GITHUB_SHA" -- pkg/executor/embed pkg/scheduler/plugins/gpustability cmd/space-compute-scheduler docs/gpu-scheduler/manifests/space-compute-scheduler.yaml || true)"
        test -z "$changed"
        grep -q 'kind: PhysicalDeviceInventory' docs/space-compute/manifests/phase9-canonical-crds.yaml
        for f in stableDeviceID kubernetesResourceName allocationID peerInterconnects memoryBandwidthBitsPerSecond interconnectBandwidthBitsPerSecond firmware driver runtime libraries temperatureMilliCelsius powerMilliwatts; do grep -q "$f" docs/space-compute/manifests/phase9-canonical-crds.yaml; done
        for f in cpu: systemMemoryBytes ephemeralStorageBytes persistentStorage numaTopology trust: autonomyDurationSeconds energy: physicalDeviceInventoryRef cpuMilliCapacity cpuMilliAvailable memoryCapacityBytes memoryAvailableBytes capacityMilliWattHours availableMilliWattHours; do grep -q "$f" docs/space-compute/manifests/phase9-canonical-crds.yaml; done
        for f in workingMemoryBytes workingStorageBytes minimumBandwidthBitsPerSecond maximumRTTMicroseconds maximumLossPartsPerMillion selectedCapabilitySetName selectedPhysicalDeviceConstraints transferState transferReceiptReferences executionLeaseReference fencingTokenHash checkpointReceipt resultReceipt remoteAcknowledgementSequence; do grep -q "$f" docs/space-compute/manifests/phase9-canonical-crds.yaml; done
        grep -q 'CanonicalVersion.*v1beta1' contrib/space-compute/pkg/apis/v1alpha1/register.go
        grep -q 'suspend: true' docs/space-compute/manifests/storage-version-migrator.yaml
        grep -q -- '--target-version=v1beta1' docs/space-compute/manifests/storage-version-migrator.yaml
        grep -q 'apiVersions: \[v1alpha1, v1beta1\]' docs/space-compute/manifests/mission-admission-webhook.yaml
        grep -q 'apiVersions: \[v1alpha1, v1beta1\]' docs/space-compute/manifests/reporter-admission-webhook.yaml
    - name: Run focused Phase 9 tests
      run: |
        set -o pipefail
        go test ./cmd/space-compute-conversion-webhook ./cmd/space-compute-storage-migrator ./cmd/space-compute-mission-planner ./cmd/space-compute-reporter-webhook ./cmd/space-compute-domain-agent ./contrib/space-compute/pkg/apis/v1alpha1 ./contrib/space-compute/pkg/apis/v1beta1 ./contrib/space-compute/pkg/conversion ./contrib/space-compute/pkg/migration ./contrib/space-compute/pkg/admission ./contrib/space-compute/pkg/kube ./contrib/space-compute/pkg/planner ./contrib/space-compute/pkg/transport ./contrib/space-compute/pkg/workload -count=1 2>&1 | tee /tmp/stage9-focused.log
        go test -race ./contrib/space-compute/pkg/conversion ./contrib/space-compute/pkg/migration ./contrib/space-compute/pkg/admission ./contrib/space-compute/pkg/kube ./contrib/space-compute/pkg/planner ./contrib/space-compute/pkg/workload -count=1 2>&1 | tee /tmp/stage9-race.log
    - name: Run complete repository gate
      run: |
        set -o pipefail
        scripts/space-compute all 2>&1 | tee /tmp/space-compute-all.log
    - name: Verify module graph and default K3s scheduler isolation
      run: |
        set -euo pipefail
        go mod verify
        go mod tidy -diff
        go test ./pkg/executor/embed -count=1
    - name: Record Phase 9 verification evidence
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        p=Path('docs/space-compute/IMPLEMENTATION_STATUS.md'); text=p.read_text()
        marker='## Phase 9 canonical API upgrade\n'
        if marker in text: raise SystemExit('Phase 9 status section already exists')
        section=f'''\n## Phase 9 canonical API upgrade\n\n- Executed on 2026-07-27 by GitHub Actions run `{os.environ["GITHUB_RUN_ID"]}` from validation baseline `{os.environ["GITHUB_SHA"]}` before non-force fast-forward publication.\n- Added `spacecompute.k3s.io/v1beta1` as canonical/storage while retaining `v1alpha1` served, with webhook conversion and identical canonical schemas for lossless downgrade/rollback views. Conversion preserves raw schema-admitted JSON and exact fixed-width integers.\n- Added signed `PhysicalDeviceInventory`, expanded domain CPU/memory/storage/NUMA/trust/attestation/autonomy/energy/inventory state, and added Mission working-memory/storage/bandwidth/RTT/loss hard constraints. Present hard-constraint violations reject in strict/degraded/best-effort; the modes differ only for missing trusted state.\n- Placement now records selected capability/physical-device constraints plus transfer receipts/state, execution lease, fencing hash, checkpoint/result receipts and remote acknowledgement sequence.\n- Added deployable conversion-webhook and default-suspended stored-version migrator. Forward migration rewrites objects through `v1beta1` before narrowing `storedVersions`; rollback rewrites through `v1alpha1` before beta removal. Migrator admission permits semantic no-op rewrites only.\n- Successful gates: focused unit/race, unchanged `scripts/space-compute all`, `go mod verify`, `go mod tidy -diff`, YAML/schema/isolation checks and `go test ./pkg/executor/embed -count=1`. Tests cover alpha->beta, beta->alpha, round trip, schema-admitted unknown/new data and large integers, stored-version migration, rollback and hard-field preservation.\n- Default K3s scheduler source/profile/manifest stayed outside the Phase 9 production diff. Full-agent K3s patch-upgrade and physical-hardware qualification remain separate release gates.\n\n'''
        i=text.find('## Verified plugin catalogue')
        if i<0: raise SystemExit('status insertion marker missing')
        p.write_text(text[:i]+section+text[i:])
        PY
    - name: Upload gate failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: stage9-canonical-api-error
        path: |
          /tmp/stage9-focused.log
          /tmp/stage9-race.log
          /tmp/space-compute-all.log
        if-no-files-found: ignore
    - name: Fast-forward Phase 9 production source
      id: publish
      run: |
        set -euo pipefail
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
        rm -rf bin
        git rm -rf .github/stage9-source-trigger .github/workflows/stage9-source-snapshot.yml .github/stage9-gate-trigger .github/workflows/stage9-canonical-api.yml .github/stage9-payload
        git add -A
        git diff --cached --check
        git config user.name space-compute-stage9-bot
        git config user.email space-compute-stage9-bot@users.noreply.github.com
        git commit -m 'feat: upgrade space-compute canonical API'
        new_sha="$(git rev-parse HEAD)"
        git push origin HEAD:main
        echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
    - name: Publish final success status
      if: success()
      env: {GH_TOKEN: "${{ github.token }}", NEW_SHA: "${{ steps.publish.outputs.new_sha }}"}
      run: |
        gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="sandbox/stage9-canonical-api-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 9 gate passed and main fast-forwarded"
        gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA}" -f state=success -f context="sandbox/stage9-canonical-api" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Canonical API v1beta1 upgrade verified"
    - name: Publish failure status
      if: failure()
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context="sandbox/stage9-canonical-api-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 9 canonical API gate failed; production source not published"
