name: stage7-inspect
on:
  push:
    branches: [main]
    paths: [.github/stage7-inspect-trigger]
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with: {ref: "${{ github.sha }}", fetch-depth: 1}
    - name: Diagnose staged Phase 7 payload
      run: |
        set -euo pipefail
        {
          sha256sum .github/stage7-payload/part-*
          wc -c .github/stage7-payload/part-*
          cat .github/stage7-payload/part-* > /tmp/stage7-source.b64
          printf 'combined-bytes '
          wc -c < /tmp/stage7-source.b64
          python3 - <<'PY'
        import base64, hashlib, zlib
        from pathlib import Path
        payload = Path('/tmp/stage7-source.b64').read_bytes()
        print('combined-sha256', hashlib.sha256(payload).hexdigest())
        try:
            raw = zlib.decompress(base64.b64decode(payload, validate=True))
            print('decoded-bytes', len(raw))
            print('patch-sha256', hashlib.sha256(raw).hexdigest())
        except Exception as exc:
            print('decode-error', repr(exc))
        PY
        } | tee /tmp/stage7-payload-diagnostic.txt
    - uses: actions/upload-artifact@v4
      with:
        name: stage7-payload-diagnostic
        path: /tmp/stage7-payload-diagnostic.txt
        if-no-files-found: error
