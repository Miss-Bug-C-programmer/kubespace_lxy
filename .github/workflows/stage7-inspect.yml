name: stage7-inspect
on:
  push:
    branches: [main]
    paths: [.github/stage7-inspect-trigger]
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
    - name: Publish inspection status
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context="sandbox/stage7-inspect-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Enumerating Phase 7 planner/API call sites"
    - uses: actions/checkout@v4
      with: {ref: "${{ github.sha }}", fetch-depth: 1}
    - name: Enumerate Phase 7 call sites
      run: |
        set -euo pipefail
        {
          printf '%s\n' '=== FILES ==='
          find contrib/space-compute cmd tests docs/space-compute -type f 2>/dev/null | sort || true
          printf '%s\n' '=== CALLSITES ==='
          rg -n --no-heading 'ResultDestinations|\.Locations|DataObject|DeviceCapacity|QueueDelaySeconds|MaximumSnapshotAgeSecs|TransferEpoch|predictedComputeSeconds|capacityMismatch|buildLinkIndex|locationMatchesDomain' contrib/space-compute cmd tests docs/space-compute || true
          printf '%s\n' '=== TOPOLOGY ==='
          rg -n --no-heading -i 'topology' contrib/space-compute docs/space-compute || true
        } | tee /tmp/stage7-inspect.txt
    - name: Upload inspection artifact
      uses: actions/upload-artifact@v4
      with:
        name: stage7-callsite-inspection
        path: /tmp/stage7-inspect.txt
        if-no-files-found: error
    - name: Publish inspection success
      if: success()
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="sandbox/stage7-inspect-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 7 callsite inspection complete"
