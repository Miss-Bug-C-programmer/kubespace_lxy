name: stage7-inspect
on:
  push:
    branches: [main]
    paths: [.github/stage7-inspect-trigger]
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
    - name: Publish diagnostic status
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context="sandbox/stage7-payload-diagnostic-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Checking corrected Phase 7 payload hashes"
    - uses: actions/checkout@v4
      with: {ref: "${{ github.sha }}", fetch-depth: 1}
    - name: Diagnose corrected Phase 7 payload
      run: |
        set -euo pipefail
        {
          sha256sum \
            .github/stage7-payload/part-00 \
            .github/stage7-payload/fix-01-00 .github/stage7-payload/fix-01-01 .github/stage7-payload/fix-01-02 \
            .github/stage7-payload/part-02 .github/stage7-payload/part-03 .github/stage7-payload/part-04 \
            .github/stage7-payload/fix-05-00 .github/stage7-payload/fix-05-01 .github/stage7-payload/fix-05-02 \
            .github/stage7-payload/part-06
          cat \
            .github/stage7-payload/part-00 \
            .github/stage7-payload/fix-01-00 .github/stage7-payload/fix-01-01 .github/stage7-payload/fix-01-02 \
            .github/stage7-payload/part-02 .github/stage7-payload/part-03 .github/stage7-payload/part-04 \
            .github/stage7-payload/fix-05-00 .github/stage7-payload/fix-05-01 .github/stage7-payload/fix-05-02 \
            .github/stage7-payload/part-06 > /tmp/stage7-source.b64
          printf 'combined-bytes '; wc -c < /tmp/stage7-source.b64
          python3 -c "import base64,hashlib,zlib,pathlib; p=pathlib.Path('/tmp/stage7-source.b64').read_bytes(); print('combined-sha256',hashlib.sha256(p).hexdigest()); r=zlib.decompress(base64.b64decode(p,validate=True)); print('decoded-bytes',len(r)); print('patch-sha256',hashlib.sha256(r).hexdigest())" || echo 'decode-command-failed'
        } | tee /tmp/stage7-payload-diagnostic.txt
    - uses: actions/upload-artifact@v4
      with:
        name: stage7-payload-diagnostic
        path: /tmp/stage7-payload-diagnostic.txt
        if-no-files-found: error
    - name: Publish diagnostic success
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="sandbox/stage7-payload-diagnostic-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Corrected Phase 7 payload diagnostic complete"
