name: stage7-inspect
on:
  push:
    branches: [main]
    paths: [.github/stage7-inspect-trigger]
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
    - name: Publish inspection status
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context="sandbox/stage7-inspect-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Enumerating Phase 7 planner/API call sites"
    - uses: actions/checkout@v4
      with: {ref: "${{ github.sha }}", fetch-depth: 1}
    - name: Enumerate Phase 7 call sites
      run: |
        set -euo pipefail
        {
          printf '%s\n' '=== CALLSITES ==='
          grep -R -n -E 'ResultDestinations|\.Locations|DataObject|DeviceCapacity|QueueDelaySeconds|MaximumSnapshotAgeSecs|TransferEpoch|predictedComputeSeconds|capacityMismatch|buildLinkIndex|locationMatchesDomain' contrib/space-compute cmd tests/integration/spacecomputescheduler docs/space-compute 2>/dev/null || true
          printf '%s\n' '=== TOPOLOGY ==='
          grep -R -n -i 'topology' contrib/space-compute docs/space-compute 2>/dev/null || true
        } | tee /tmp/stage7-inspect.txt
    - name: Build source snapshot
      run: |
        tar -czf /tmp/stage7-source-snapshot.tgz \
          go.mod go.sum Makefile scripts/space-compute \
          contrib/space-compute \
          cmd/space-compute-mission-planner cmd/space-compute-domain-agent cmd/space-compute-mission-webhook cmd/space-compute-reporter-webhook cmd/space-compute-scheduler \
          tests/integration/spacecomputescheduler \
          docs/space-compute docs/gpu-scheduler/manifests/space-compute-scheduler.yaml
    - name: Upload inspection artifact
      uses: actions/upload-artifact@v4
      with:
        name: stage7-callsite-inspection
        path: /tmp/stage7-inspect.txt
        if-no-files-found: error
    - name: Upload source snapshot
      uses: actions/upload-artifact@v4
      with:
        name: stage7-source-snapshot
        path: /tmp/stage7-source-snapshot.tgz
        if-no-files-found: error
    - name: Publish inspection success
      if: success()
      env: {GH_TOKEN: "${{ github.token }}"}
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="sandbox/stage7-inspect-${GITHUB_RUN_ID}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f description="Phase 7 callsite inspection complete"
