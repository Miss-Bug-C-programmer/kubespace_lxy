            properties:
              source:
                type: object
                required:
                - name
                - clusterID
                - orbitClass
                properties:
                  name:
                    type: string
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                  clusterID:
                    type: string
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                  orbitClass:
                    type: string
