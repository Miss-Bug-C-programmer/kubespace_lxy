                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                  clusterID:
                    type: string
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                  orbitClass:
                    type: string
                    enum:
                    - ground
                    - leo
                    - meo
                    - geo
                    - heo
              observedAt:
                type: string
                format: date-time
              validUntil:
                type: string
                format: date-time
              maximumClockSkewSeconds:
                type: integer
                format: int64
                minimum: 0
                maximum: 600
              minimumUpdateSeconds:
                type: integer
                format: int64
                minimum: 1
                maximum: 3600
              historyLimit:
                type: integer
                format: int32
                minimum: 1
                maximum: 64
              provenance:
                type: object
                required:
                - reporterID
                - source
                - digest
                - sequence
                properties:
                  reporterID:
                    type: string
                    minLength: 1
                    maxLength: 253
                  source:
                    type: string
                    minLength: 1
                    maxLength: 256
                  digest:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  previousDigest:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  sequence:
                    type: integer
                    format: int64
                    minimum: 1
                  signature:
                    type: string
                    minLength: 1
                    maxLength: 256
              windows:
                type: array
                minItems: 1
                maxItems: 256
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - id
                items:
                  type: object
                  required:
                  - id
                  - start
                  - end
                  - bandwidthBitsPerSecond
                  - rttMicroseconds
                  - lossPartsPerMillion
                  - errorPartsPerMillion
                  - stabilityMilli
                  - confidenceMilli
                  - predicted
                  properties:
                    id:
                      type: string
                      maxLength: 63
                    start:
                      type: string
                      format: date-time
                    end:
                      type: string
                      format: date-time
                    bandwidthBitsPerSecond:
                      type: integer
                      format: int64
                      minimum: 1
                      maximum: 10000000000000
                    rttMicroseconds:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 86400000000
                    lossPartsPerMillion:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 1000000
                    errorPartsPerMillion:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 1000000
                    stabilityMilli:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 1000
                    confidenceMilli:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 1000
                    predicted:
                      type: boolean
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
