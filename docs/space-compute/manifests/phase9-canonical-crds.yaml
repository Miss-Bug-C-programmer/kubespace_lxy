  - name: v1beta1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - domain
            - nodeName
            - observedAt
            - validUntil
            - confidenceMilli
            - provenance
            - devices
            properties:
              domain:
                type: object
                required:
                - name
                - clusterID
                - orbitClass
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                  clusterID:
                    type: string
                    minLength: 1
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                  orbitClass:
                    type: string
                    enum:
                    - ground
                    - leo
                    - meo
                    - geo
                    - heo
              nodeName:
                type: string
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
              observedAt:
                type: string
                format: date-time
              validUntil:
                type: string
                format: date-time
              confidenceMilli:
                type: integer
                format: int32
                minimum: 0
                maximum: 1000
              provenance:
                type: object
                required:
                - reporterID
                - source
                - digest
                - sequence
                properties:
                  reporterID:
                    type: string
                    minLength: 1
                    maxLength: 253
                  source:
                    type: string
                    minLength: 1
                    maxLength: 256
                  digest:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  previousDigest:
                    type: string
                    pattern: ^(|[a-f0-9]{64})$
                  sequence:
                    type: integer
                    format: int64
                    minimum: 1
                  signature:
                    type: string
                    maxLength: 256
              devices:
                type: array
                maxItems: 4096
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - stableDeviceID
                items:
                  type: object
                  required:
                  - stableDeviceID
                  - kubernetesResourceName
                  - class
                  - vendor
                  - model
                  - architecture
                  - topology
                  - totalMemoryBytes
                  - freeMemoryBytes
                  - health
                  - confidenceMilli
                  properties:
                    stableDeviceID:
                      type: string
                      minLength: 1
                      maxLength: 253
                    kubernetesResourceName:
                      type: string
                      minLength: 1
                      maxLength: 253
                    allocationID:
                      type: string
                      maxLength: 512
                    class:
                      type: string
                      minLength: 1
                      maxLength: 128
                    vendor:
                      type: string
                      minLength: 1
                      maxLength: 128
                    model:
                      type: string
                      minLength: 1
                      maxLength: 128
                    architecture:
                      type: string
                      minLength: 1
                      maxLength: 128
                    topology:
                      type: object
                      properties:
                        numaNode:
                          type: integer
                          format: int32
                          minimum: 0
                        socketID:
                          type: string
                          maxLength: 128
                        pciAddress:
                          type: string
                          maxLength: 32
                    peerInterconnects:
                      type: array
                      maxItems: 256
                      items:
                        type: object
                        required:
                        - peerStableDeviceID
                        - type
                        - bandwidthBitsPerSecond
                        properties:
                          peerStableDeviceID:
                            type: string
                            minLength: 1
                            maxLength: 253
                          type:
                            type: string
                            minLength: 1
                            maxLength: 64
                          bandwidthBitsPerSecond:
                            type: integer
                            format: int64
                            minimum: 0
                            maximum: 1000000000000000
                    totalMemoryBytes:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 1152921504606846976
                    freeMemoryBytes:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 1152921504606846976
                    memoryBandwidthBitsPerSecond:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 1000000000000000
                    interconnectBandwidthBitsPerSecond:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 1000000000000000
                    supportedPrecision:
                      type: array
                      maxItems: 32
                      items:
                        type: string
                        maxLength: 128
                    firmware:
                      type: string
                      maxLength: 128
                    driver:
                      type: string
                      maxLength: 128
                    runtime:
                      type: string
                      maxLength: 128
                    libraries:
                      type: object
                      maxProperties: 64
                      additionalProperties:
                        type: string
                        maxLength: 128
                    health:
                      type: string
                      enum:
                      - healthy
                      - degraded
                      - unhealthy
                      - unknown
                    temperatureMilliCelsius:
                      type: integer
                      format: int64
                      minimum: -273150
                      maximum: 250000
                    powerMilliwatts:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 10000000
                    confidenceMilli:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 1000
                    draAllocationID:
                      type: string
                      maxLength: 512
                    vendorAllocationID:
                      type: string
                      maxLength: 512
                  x-kubernetes-validations:
                  - rule: self.freeMemoryBytes <= self.totalMemoryBytes
                    message: free device memory cannot exceed total memory
            x-kubernetes-validations:
            - rule: timestamp(self.validUntil) > timestamp(self.observedAt)
              message: validUntil must be after observedAt
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions:
      - v1
      clientConfig:
        service:
          namespace: kube-system
          name: space-compute-conversion-webhook
          path: /convert
          port: 443
        caBundle: ''
