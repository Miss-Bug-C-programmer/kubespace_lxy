# Phase 6 least-privilege control-plane split. The three deployments reuse the
# same binary with mutually exclusive controller roles; Kubernetes identities,
# leader leases and write permissions are intentionally distinct.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: space-compute-mission-planner
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: space-compute-workload-dispatcher
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: space-compute-node-projector
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: space-compute-transport-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:space-compute-mission-planner
rules:
- apiGroups: [spacecompute.k3s.io]
  resources: [spacemissions, spaceplacementintents, spacelinksnapshots, spacedomainresourcesummaries]
  verbs: [get, list, watch]
- apiGroups: [spacecompute.k3s.io]
  resources: [spaceplacementintents]
  verbs: [create, update, patch]
- apiGroups: [spacecompute.k3s.io]
  resources: [spacemissions/status, spaceplacementintents/status, spacelinksnapshots/status, spacedomainresourcesummaries/status]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: space-compute-mission-planner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:space-compute-mission-planner
subjects:
- kind: ServiceAccount
  name: space-compute-mission-planner
  namespace: kube-system
---
# Dispatcher reads are cluster-wide so informer startup is deterministic, but
# Pod create/delete and placement/status writes are NOT cluster-bound. An
# administrator must bind system:space-compute-workload-dispatcher-namespace
# with a RoleBinding in every explicitly authorized Mission namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:space-compute-workload-dispatcher-read
rules:
- apiGroups: [spacecompute.k3s.io]
  resources: [spacemissions, spaceplacementintents, spacetransferintents, spacetransferreceipts, spaceexecutionleases, spaceexecutionobservations, spaceresultreceipts]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: space-compute-workload-dispatcher-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:space-compute-workload-dispatcher-read
subjects:
- kind: ServiceAccount
  name: space-compute-workload-dispatcher
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:space-compute-workload-dispatcher-namespace
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, create, delete]
- apiGroups: [spacecompute.k3s.io]
  resources: [spaceplacementintents, spaceplacementintents/status]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:space-compute-node-projector
rules:
- apiGroups: [spacecompute.k3s.io]
  resources: [spacelinksnapshots, spacedomainresourcesummaries]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: space-compute-node-projector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:space-compute-node-projector
subjects:
- kind: ServiceAccount
  name: space-compute-node-projector
  namespace: kube-system
---
# This transport role is deliberately unable to create Pods, mutate Nodes or
# read arbitrary Secrets. It is the role to bind to a transport-only process.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:space-compute-transport-agent
rules:
- apiGroups: [spacecompute.k3s.io]
  resources: [spacemissions, spaceplacementintents]
  verbs: [get, list, watch]
- apiGroups: [spacecompute.k3s.io]
  resources: [spacetransferintents, spacetransferreceipts, spaceexecutionleases, spaceexecutionobservations, spaceresultreceipts]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: space-compute-transport-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:space-compute-transport-agent
subjects:
- kind: ServiceAccount
  name: space-compute-transport-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: space-compute-controller-leader-election
  namespace: kube-system
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: space-compute-mission-planner-leader-election
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: space-compute-controller-leader-election
subjects:
- kind: ServiceAccount
  name: space-compute-mission-planner
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: space-compute-workload-dispatcher-leader-election
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: space-compute-controller-leader-election
subjects:
- kind: ServiceAccount
  name: space-compute-workload-dispatcher
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: space-compute-node-projector-leader-election
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: space-compute-controller-leader-election
subjects:
- kind: ServiceAccount
  name: space-compute-node-projector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: space-compute-transport-agent-leader-election
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: space-compute-controller-leader-election
subjects:
- kind: ServiceAccount
  name: space-compute-transport-agent
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-compute-mission-planner
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: space-compute-mission-planner, spacecompute.k3s.io/controller-role: planner}
  template:
    metadata:
      labels: {app.kubernetes.io/name: space-compute-mission-planner, spacecompute.k3s.io/controller-role: planner}
    spec:
      serviceAccountName: space-compute-mission-planner
      priorityClassName: system-cluster-critical
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: planner
        image: space-compute-mission-planner:v1.33.7-k3s1
        imagePullPolicy: IfNotPresent
        args:
        - --controller-role=planner
        - --workers=2
        - --max-pending-unique-keys=10000
        - --api-qps=20
        - --api-burst=40
        - --leader-elect=true
        - --leader-election-namespace=kube-system
        - --leader-election-name=space-compute-mission-planner
        - --metrics-bind-address=:10261
        ports: [{name: health, containerPort: 10261}]
        readinessProbe: {httpGet: {path: /readyz, port: health}, initialDelaySeconds: 3}
        livenessProbe: {httpGet: {path: /livez, port: health}, initialDelaySeconds: 10}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "2", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities: {drop: [ALL]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-compute-workload-dispatcher
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: space-compute-workload-dispatcher}
  template:
    metadata:
      labels: {app.kubernetes.io/name: space-compute-workload-dispatcher}
    spec:
      serviceAccountName: space-compute-workload-dispatcher
      priorityClassName: system-cluster-critical
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: dispatcher
        image: space-compute-mission-planner:v1.33.7-k3s1
        imagePullPolicy: IfNotPresent
        args:
        - --controller-role=workload-dispatcher
        - --workers=2
        - --max-pending-unique-keys=10000
        - --api-qps=20
        - --api-burst=40
        - --leader-elect=true
        - --leader-election-namespace=kube-system
        - --leader-election-name=space-compute-workload-dispatcher
        - --metrics-bind-address=:10262
        ports: [{name: health, containerPort: 10262}]
        readinessProbe: {httpGet: {path: /readyz, port: health}, initialDelaySeconds: 3}
        livenessProbe: {httpGet: {path: /livez, port: health}, initialDelaySeconds: 10}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "2", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities: {drop: [ALL]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-compute-node-projector
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: space-compute-node-projector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: space-compute-node-projector}
    spec:
      serviceAccountName: space-compute-node-projector
      priorityClassName: system-cluster-critical
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: projector
        image: space-compute-mission-planner:v1.33.7-k3s1
        imagePullPolicy: IfNotPresent
        args:
        - --controller-role=node-projector
        - --workers=1
        - --max-pending-unique-keys=10000
        - --api-qps=20
        - --api-burst=40
        - --leader-elect=true
        - --leader-election-namespace=kube-system
        - --leader-election-name=space-compute-node-projector
        - --metrics-bind-address=:10263
        ports: [{name: health, containerPort: 10263}]
        readinessProbe: {httpGet: {path: /readyz, port: health}, initialDelaySeconds: 3}
        livenessProbe: {httpGet: {path: /livez, port: health}, initialDelaySeconds: 10}
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities: {drop: [ALL]}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-compute-transport-agent
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: space-compute-transport-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: space-compute-transport-agent}
    spec:
      serviceAccountName: space-compute-transport-agent
      priorityClassName: system-cluster-critical
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: transport-agent
        image: space-compute-mission-planner:v1.33.7-k3s1
        imagePullPolicy: IfNotPresent
        args:
        - --controller-role=transport-agent
        - --workers=2
        - --max-pending-unique-keys=10000
        - --api-qps=20
        - --api-burst=40
        - --leader-elect=true
        - --leader-election-namespace=kube-system
        - --leader-election-name=space-compute-transport-agent
        - --metrics-bind-address=:10264
        env:
        - name: SPACE_COMPUTE_LOCAL_DOMAIN_JSON
          valueFrom:
            configMapKeyRef:
              name: space-compute-domain-identity
              key: domain.json
              optional: false
        ports: [{name: health, containerPort: 10264}]
        readinessProbe: {httpGet: {path: /readyz, port: health}, initialDelaySeconds: 3}
        livenessProbe: {httpGet: {path: /livez, port: health}, initialDelaySeconds: 10}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities: {drop: [ALL]}
