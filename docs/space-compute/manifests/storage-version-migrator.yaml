# Phase 9 explicit storage-version migration. This Job is intentionally
# suspended. Unsuspend it only after the conversion webhook is Ready, the CA is
# installed in all CRDs, and v1beta1 reads/writes have been smoke-tested.
# Rollback uses the same image with --target-version=v1alpha1 while both served
# versions and the conversion webhook are still available.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: space-compute-storage-migrator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:space-compute-storage-migrator
rules:
- apiGroups: [apiextensions.k8s.io]
  resources: [customresourcedefinitions, customresourcedefinitions/status]
  verbs: [get, list, update, patch]
- apiGroups: [spacecompute.k3s.io]
  resources:
  - spacelinksnapshots
  - spacedomainresourcesummaries
  - physicaldeviceinventories
  - spacedomainreporterbindings
  - spacetransferintents
  - spacetransferreceipts
  - spaceexecutionleases
  - spaceexecutionobservations
  - spaceresultreceipts
  - spacemissions
  - spaceplacementintents
  verbs: [get, list, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: space-compute-storage-migrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:space-compute-storage-migrator
subjects:
- kind: ServiceAccount
  name: space-compute-storage-migrator
  namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: space-compute-storage-migrate-v1beta1
  namespace: kube-system
spec:
  suspend: true
  backoffLimit: 1
  template:
    metadata:
      labels: {app.kubernetes.io/name: space-compute-storage-migrator}
    spec:
      restartPolicy: Never
      serviceAccountName: space-compute-storage-migrator
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: migrator
        image: space-compute-storage-migrator:v1.33.7-k3s1
        imagePullPolicy: IfNotPresent
        args: [--target-version=v1beta1]
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: "1", memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities: {drop: [ALL]}
